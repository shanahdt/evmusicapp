<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Noise Lab Experiments{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='images/noise lab logo.png')}}"
        alt="NoiseLab"
        class="NoiseLab-logo">
    </a>
    <img src="{{ url_for('static', filename='images/NUMusic.png')}}"
     alt="NUMusic"
     class="NUMusic-logo">
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="https://sites.northwestern.edu/noise/about/" target="_blank" rel="noopener noreferrer" class="footer-link">About Noise Lab</a>
  </footer>
</body>
</html>
