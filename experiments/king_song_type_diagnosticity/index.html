    function pipeFilename(prefix, participantId) {
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        return `${prefix}_${participantId}_${stamp}_${Math.random().toString(36).slice(2, 8)}.json`;
    }

    // Set to false before deploying for real data collection -- this
    // appends a raw data dump + download button at the very end of the
    // page, for local testing only.
    const SHOW_DEBUG_DATA = true;

    /* ================================================================
       PARTICIPANT -> LIST ASSIGNMENT (1 of 15 BIBD blocks)
       ================================================================ */
    function assignListId(subjectId, numLists) {
        let hash = 0;
        for (let i = 0; i < subjectId.length; i++) {
            hash = (hash * 31 + subjectId.charCodeAt(i)) >>> 0;
        }
        return hash % numLists;
    }

    /* ================================================================
       RESULTS-PAGE LOGIC: tally + ridge logistic regression
       ================================================================ */
    function sigmoid(z) {
        return 1 / (1 + Math.exp(-z));
    }

    // Ridge (L2) logistic regression via batch gradient descent.
    // With only 36 rows (12 trials x 3 options) and ~15-18 predictors,
    // this is a descriptive within-subject summary, not an inferential
    // test -- treat coefficients as relative weights for feedback, not
    // as statistically significant effects.
    function fitRidgeLogistic(X, y, lambda = 1.0, lr = 0.3, iters = 3000) {
        const n = X.length;
        const p = X[0].length;
        let w = new Array(p).fill(0);
        let b = 0;
        for (let it = 0; it < iters; it++) {
            const gradW = new Array(p).fill(0);
            let gradB = 0;
            for (let i = 0; i < n; i++) {
                let z = b;
                for (let j = 0; j < p; j++) z += w[j] * X[i][j];
                const pred = sigmoid(z);
                const err = pred - y[i];
                for (let j = 0; j < p; j++) gradW[j] += err * X[i][j];
                gradB += err;
            }
            for (let j = 0; j < p; j++) {
                w[j] -= lr * (gradW[j] / n + (lambda * w[j]) / n);
            }
            b -= lr * (gradB / n);
        }
        return { weights: w, bias: b };
    }

    function buildDesignMatrix(trialRecords) {
        const keySet = new Set();
        trialRecords.forEach(t => t.options.forEach(o => {
            Object.keys(o).forEach(k => {
                if (k.startsWith("groove_") || k.startsWith("timbre_")) keySet.add(k);
            });
        }));
        const featureNames = Array.from(keySet).sort();
        const X = [];
        const y = [];
        trialRecords.forEach(t => t.options.forEach(o => {
            X.push(featureNames.map(k => (k in o ? o[k] : 0)));
            y.push(o.chosen);
        }));
        return { X, y, featureNames };
    }

    function summarizeGrooveVsTimbre(featureNames, weights) {
        const groove = [], timbre = [];
        featureNames.forEach((name, i) => {
            if (name.startsWith("groove_")) groove.push({ name, weight: weights[i] });
            else if (name.startsWith("timbre_")) timbre.push({ name, weight: weights[i] });
        });
        const meanAbs = arr => arr.length ? arr.reduce((s, x) => s + Math.abs(x.weight), 0) / arr.length : 0;
        return { groove, timbre, grooveScore: meanAbs(groove), timbreScore: meanAbs(timbre) };
    }

    function tallyMatchTypes(trialRecords) {
        const counts = { type_match: 0, origin_match: 0, neither_match: 0 };
        trialRecords.forEach(t => {
            const chosen = t.options.find(o => o.chosen === 1);
            if (chosen) counts[chosen.match_type]++;
        });
        return counts;
    }

    function buildResultsHtml(trialRecords) {
        const tally = tallyMatchTypes(trialRecords);
        const total = tally.type_match + tally.origin_match + tally.neither_match;
        const labels = {
            type_match: "Song type",
            origin_match: "Origin",
            neither_match: "Neither"
        };
        const maxCount = Math.max(tally.type_match, tally.origin_match, tally.neither_match);
        const topKeys = Object.keys(tally).filter(k => tally[k] === maxCount);
        const primaryLabel = topKeys.length > 1
            ? topKeys.map(k => labels[k]).join(" / ") + " (tied)"
            : labels[topKeys[0]];

        let barsHtml = "";
        Object.keys(labels).forEach(key => {
            const pct = total ? Math.round((tally[key] / total) * 100) : 0;
            barsHtml += `
                <div class="result-bar-row">
                    <div class="result-bar-label">${labels[key]}</div>
                    <div class="result-bar-track"><div class="result-bar-fill" style="width:${pct}%"></div></div>
                    <div class="result-bar-count">${tally[key]} / ${total}</div>
                </div>`;
        });

        // song type v. origin
        let primaryDescriptor;
        if (tally.type_match > tally.origin_match) primaryDescriptor = "song type";
        else if (tally.origin_match > tally.type_match) primaryDescriptor = "origin";
        else primaryDescriptor = "song type and origin equally";

        const primaryDescriptionHtml = `  
            <p>Data submitted. Thank you for your participation! You may close this window when you're finished reading.</p>    
            <h3>Primary sorting pattern: ${primaryDescriptor}</h3>
            <p>This study is interested in whether people generally categorize by song type or origins.
            In general, you categorized by <strong>${primaryDescriptor}</strong>.</p>
            <details>
                <summary>Learn more!</summary>
                <p><b>Song type</b> refers to the function a song serves in a musical: Exposition songs usually open the musical and introduce characters and the setting. I Want songs are characters singing about their desires. Villain songs are when the antagonist sings about their plans. Love songs are when characters sing about love. If you categorized by song type, it means that you tend to listen more for the narrative function of a song more than specific production techniques.</p>
                <p><b>Origin</b>, for this study, refers to whether a song was produced by Disney or not. Non-Disney songs came from other non-Disney animated musicals or from stage musicals. If you categorized by origins more, it means that you tend to focus more on specific production techniques (musical features, singing technique, etc.) more than the larger narrative function of each song.</p>
                <p>If you sorted by <b>neither</b>, it means that a different musical element is stronger than song type or origins, which makes for an interesting next study!</p>
            </details>
                `;

        // groove v. timbre
        const { X, y, featureNames } = buildDesignMatrix(trialRecords);
        let secondaryHtml = "";
        let secondaryDescriptionHtml = "";
        if (X.length > 0 && featureNames.length > 0) {
            const { weights } = fitRidgeLogistic(X, y);
            const summary = summarizeGrooveVsTimbre(featureNames, weights);
            const secondaryTop = summary.grooveScore === summary.timbreScore
                ? "groove and vocal timbre equally"
                : (summary.grooveScore > summary.timbreScore ? "groove" : "vocal timbre");

            secondaryDescriptionHtml = `
                <p>This study is also secondarily interested groove and vocal timbre.</p>
                <p>Of the 2, you sorted more by <strong>${secondaryTop}</strong>.</p>
                <details>
                    <summary>Learn more!</summary>
                    <p><b>Groove</b> is a tricky thing to define, but for this study, we took tempo (the speed of the song), syncopation, whether it was in a major or minor key, and whether it had a strong backbeat into account.</p>
                    <p><b>Vocal timbre</b> also has many parts. For this study, we looked at resonance (head, chest, or mixed voice), color (bright, dark, etc.), whether it was a soloist or a group of singers, and the gender of the singer(s).</p>
                </details>
                `;

            // Calculates percentage weight for the groove and timbre graph based on relative contribution
            const scoreTotal = summary.grooveScore + summary.timbreScore;
            const groovePct = scoreTotal ? Math.round((summary.grooveScore / scoreTotal) * 100) : 0;
            const timbrePct = scoreTotal ? Math.round((summary.timbreScore / scoreTotal) * 100) : 0;

            const secondaryBarsHtml = `
                <div class="result-bar-row">
                    <div class="result-bar-label">Groove</div>
                    <div class="result-bar-track"><div class="result-bar-fill" style="width:${groovePct}%"></div></div>
                    <div class="result-bar-count">${groovePct}%</div>
                </div>
                <div class="result-bar-row">
                    <div class="result-bar-label">Timbre</div>
                    <div class="result-bar-track"><div class="result-bar-fill" style="width:${timbrePct}%"></div></div>
                    <div class="result-bar-count">${timbrePct}%</div>
                </div>`;

            secondaryHtml = `
            <div class="description-blocks">    
                <h3>Secondary pattern: groove vs. vocal timbre</h3>
                    ${secondaryDescriptionHtml}
                    ${secondaryBarsHtml}
            </div>
            `;
        }

        // lists the songs the participant heard
        const songMap = new Map();
        trialRecords.forEach(t => {
            if (t.target) songMap.set(t.target.name, t.target.musical);
            t.options.forEach(o => songMap.set(o.name, o.musical));
        });
        const songRows = Array.from(songMap.entries())
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([name, musical]) => `<tr><td>${name}</td><td>${musical}</td></tr>`)
            .join("");
        const songListHtml = `
            <h3>Songs you heard</h3>
            <table>
                <tr>
                    <th class="songs-table-header">Song</th>
                    <th class="songs-table-header">Musical</th>
                </tr>
                ${songRows}
            </table>`;

        return `
            <div class="results-section description-blocks">
                <h2>Your results</h2>
                ${primaryDescriptionHtml}
                <p><strong>Primary sorting tendency:</strong> ${primaryLabel}</p>
                ${barsHtml}
                ${secondaryHtml}
                ${songListHtml}
            </div>`;
    }

                            {value: "listen-nda", text: "I listen to or watch other non-Disney musicals often."},
                            {value: "listen-broadway", text: "I listen to or watch Broadway or other stage musicals often."},
                            {value: "preferred-versions", text: "I have preferred versions of songs from musicals (Disney, Broadway, etc.)."},
                            {value: "read-musicals", text: "I often read or search the internet for things related to musicals (Disney, Broadway, etc.)."},
                        ],
                        isAllRowRequired: true
                    }
                ]
            }
        }
        timeline.push(musical_genre_questions);

        /* Loads the participant's 12-trial BIBD list and builds the
           similarity-judgment timeline. */
        const response = await fetch(TRIAL_LISTS_URL);
        const allLists = await response.json();
        const listIndex = assignListId(participant_id, allLists.length);
        const myList = allLists[listIndex];
        jsPsych.data.addProperties({ list_id: myList.list_id, block_types: myList.block_types.join(";") });

        /* jsPsychPreload threw a lot of errors here, so chose note to use it for audio here. Used preload="auto" in the audio tags instead. */

        // Collect full trial records (with chosen flags) here as trials
        // complete, so the results page can use them without re-querying
        // jsPsych's data module.
        const completedTrialRecords = [];

        const similarityTrials = myList.trials.map((trial, trialIdx) => {
            const shuffledOptions = jsPsych.randomization.shuffle(trial.options);

            const targetAudioHtml =
                `<h2>Which song sounds the most similar to this one:</h2>
                 <audio controls preload="auto"><source src="${AUDIO_DIR + trial.target.filename}"></audio>`;

            return {
                type: jsPsychSurveyMultiChoice,
                questions: function () {
                    return [{
                        prompt: targetAudioHtml,
                        options: shuffledOptions.map(o =>
                            `<audio controls preload='auto'><source src='${AUDIO_DIR + o.filename}'></audio>`),
                        required: true,
                        horizontal: true
                    }];
                },
                data: {
                    phase: "similarity_trial",
                    trial_index_in_list: trialIdx,
                    trial_type_pair: trial.trial_type,
                    era: trial.era,
                    target_name: trial.target.name,
                    target_filename: trial.target.filename,
                    target_disney: trial.target.disney,
                    target_song_type: trial.target.song_type
                },
                css_classes: ['test'],
                on_finish: function (data) {
                    const choice = data.response.Q0; // This is the full HTML string of the chosen audio tag
                    
                    // Find the option whose filename is embedded inside the chosen HTML string
                    const chosenOption = shuffledOptions.find(o => choice.includes(o.filename));

                    if (chosenOption) {
                        // Save the metadata directly to the trial's data object
                        data.chosen_match_type = chosenOption.match_type;
                        data.chosen_option_name = chosenOption.name;
                    }

                    // Keep your existing results-page tracking working perfectly
                    const optionsForRecord = shuffledOptions.map(o => ({
                        ...o,
                        chosen: o === chosenOption ? 1 : 0
                    }));
                    
                    completedTrialRecords.push({
                        target: { name: trial.target.name, musical: trial.target.musical },
                        options: optionsForRecord
                    });
                }
            };
        });

        // jsPsych's survey-multi-choice plugin auto-labels raw-HTML
        // options "Option 1..N" in order, matching shuffledOptions above.
        timeline.push(...similarityTrials);

        const strategies = {
            type: jsPsychSurvey,
            survey_json: {
                showQuestionNumbers: false,
                elements: [
                    { type: "comment", title: "How did it go? Was it easy/hard?" },
                    { type: "comment", title: "Did you find yourself using any particular strategy for deciding which songs sounded most similar?" },
                    { type: "html", name: "instructions", html: "<p><strong>Click &ldquo;complete&rdquo; to see your results!</strong></p>" }
                ]
            },
            /*on_finish: function() {
                var data = jsPsych.data.get().json();

                fetch('save_data.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: data
                }).then(response => {
                    window.location = "complete.html";
                });
            }*/
            on_finish: function(data) {
                const experimentData = jsPsych.data.get().json();
                const participantId = jsPsych.data.get().select('participant').values[0] || "unknown";

                // Send data to OSF via DataPipe
                fetch(DATAPIPE_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        experimentID: DATAPIPE_EXPERIMENT_ID,
                        filename: pipeFilename("king_song_type_diagnosticity", participantId),
                        data: JSON.stringify({
                            experiment_id: "king_song_type_diagnosticity",
                            participant_id: participantId,
                            data: JSON.parse(experimentData)
                        })
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("DataPipe rejected data accumulation.");
                    }
                    console.log("Data successfully saved to OSF via DataPipe.");
                })
                .catch(error => {
                    console.warn("DataPipe save failed or running locally. Triggering local backup download:", error);

                    // FALLBACK: Auto-download the CSV immediately so data isn't lost locally
                    /*const csvData = jsPsych.data.get().csv();
                    const blob = new Blob([csvData], { type: "text/csv" });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `backup_jspsych_data_${participantId}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);*/
                });
            }
        }
        timeline.push(strategies);

        const resultsPage = {
            type: jsPsychHtmlKeyboardResponse,
            choices: /*SHOW_DEBUG_DATA ? [" "] : */"NO_KEYS",
            stimulus: function () {
                return buildResultsHtml(completedTrialRecords) /*+
                    (SHOW_DEBUG_DATA
                        ? `<p style="margin-top:20px; font-size:0.85em; color:#888;">(local testing mode: press spacebar to view raw data)</p>`
                        : `<p style="margin-top:20px;">Thank you for participating!</p>`) */;
            },
            on_load: function() {
                jsPsych.progressBar.progress = 1;
            }
        };
        timeline.push(resultsPage);

        if (SHOW_DEBUG_DATA) {
            const debugPage = {
                type: jsPsychHtmlKeyboardResponse,
                choices: "NO_KEYS",
                stimulus: function () {
                    const csv = jsPsych.data.get().csv();
                    const jsonStr = JSON.stringify(jsPsych.data.get().values(), null, 2);
                    const blob = new Blob([csv], { type: "text/csv" });
                    const url = URL.createObjectURL(blob);
                    return `
                        <div id="debug-section">
                            <h3>Local testing: raw data</h3>
                            <p><a download="jspsych_data_${participant_id}.csv" href="${url}">Download CSV</a></p>
                            <p>List assigned: ${myList.list_id} (${myList.block_types.join(", ")})</p>
                            <pre>${jsonStr.replace(/</g, "&lt;")}</pre>
                        </div>`;
                }
            };
            timeline.push(debugPage);
        }

        jsPsych.run(timeline);
    }

    runSongTypeDiagnosticityExperiment();

    </script>
    </main>
    <footer>
        <a href="https://sites.northwestern.edu/noise/about/" target="_blank" rel="noopener noreferrer" class="footer-link">About Noise Lab</a>
    </footer>
</body>
