<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noise Lab Experiments</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a href="index.html">
      <img src="images/noise lab logo.png"
        alt="NoiseLab"
        class="NoiseLab-logo">
    </a>
    <img src="images/NUMusic.png"
     alt="NUMusic"
     class="NUMusic-logo">
  </header>
  <main>
    <section class="hero">
      <h1>Welcome to the Noise Lab</h1>
      <p>Select an experiment below to get started.</p>
    </section>

    <section class="experiment-list">
      <div class="experiment-card">
        <h2>Disney Categorization</h2>
        <p>Listen to and compare music from Disney and other musicals.</p>
        <a href="experiments/king_song_type_diagnosticity/" class="btn">Start</a>
      </div>
      <div class="experiment-card">
        <h2>Describing Musical Sounds</h2>
        <p>Listen to a sound and rank timbral descriptions.</p>
        <a href="experiments/oesterheld_camps_timbre_descriptions/" class="btn">Start</a>
      </div>
    </section>
  </main>
  <footer>
    <a href="https://sites.northwestern.edu/noise/about/" target="_blank" rel="noopener noreferrer" class="footer-link">About Noise Lab</a>
  </footer>
</body>
</html>
